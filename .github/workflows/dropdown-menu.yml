name: Select Name from File

on:
  workflow_dispatch:
    inputs:
      selected_name:
        description: "Select a name"
        required: true
        type: choice
        options: []

jobs:
  setup-names:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.get-names.outputs.names }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read names from file
        id: get-names
        run: |
          names=$(cat names.txt | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "names=$names" >> $GITHUB_ENV
          echo "names=$names" >> $GITHUB_OUTPUT

  trigger-dropdown:
    runs-on: ubuntu-latest
    needs: setup-names
    steps:
      - name: Show selected name
        run: echo "Selected Name: ${{ github.event.inputs.selected_name }}"
